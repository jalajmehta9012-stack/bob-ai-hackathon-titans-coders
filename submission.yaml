submission:
  title: "Multi-Source Threat Correlation & BLUF Reporting"
  problem_statement: >
    Defence analysts receive thousands of alerts daily from SIEM systems,
    satellite feeds, cyber sensors, and intelligence reports in different
    formats. No human team can read them all. Missing a genuine threat is
    catastrophic; chasing false positives wastes critical resources. Threat
    assessments must also be produced in structured BLUF format so commanders
    get a clear picture in minutes.
  solution_summary: >
    A four-stage Python pipeline built with IBM Bob that ingests simulated
    SIEM alerts and threat intelligence feeds, normalizes them into a unified
    schema, correlates related alerts using configurable field-match and
    time-window rules, maps clusters to MITRE ATT&CK techniques, and generates
    both a machine-readable JSON report and a commander-facing BLUF summary
    with structured breakdowns.
  key_features:
    - "Multi-source ingest: SIEM alerts and threat intel feeds unified into one schema"
    - "Configurable rule-based correlation with matched_rule attribution for auditability"
    - "MITRE ATT&CK mapping with false-positive guards and keyword attribution logging"
    - "CTID-style BLUF output: bottom line, why it matters, recommended action"
    - "Dual output: report.json for pipelines and structured stdout for commanders"
  tech_stack:
    languages: ["Python"]
    frameworks: []
    ibm_technologies: ["IBM Bob"]
    databases: []
    other: ["Git", "GitHub Actions"]
  what_we_are_most_proud_of: >
    The dual-output design — every run produces both a machine-readable
    report.json for downstream systems and a commander-facing BLUF with
    structured breakdown. Correlation rules carry matched_rule attribution
    so every cluster can be audited and explained.
  known_limitations: >
    MITRE ATT&CK mapping uses keyword matching against a built-in lookup
    table, so false positives are possible on real-world data. Correlation
    is rule-based, not ML-driven. Tested only against the included sample.json
    fixture (24 entries); production hardening would require integration with
    a live SIEM and a review workflow for ATT&CK mappings.

